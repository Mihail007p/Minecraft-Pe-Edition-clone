# Сборка и публикация игры на GitHub Pages.
# Проверяет PR в main; после слияния публикует main. Также запускается вручную.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true # включает Pages автоматически при первом запуске
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Публикуем только с main: окружение github-pages разрешает деплой лишь с этой ветки.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
